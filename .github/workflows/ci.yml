name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, unit, race, and generation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: make ci
      - run: make coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  synthetic-integration:
    name: Synthetic libvirt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install libvirt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvirt-clients \
            libvirt-daemon-system
      - name: Show libvirt version
        run: virsh --version
      - name: Run synthetic integration
        run: |
          set +e
          make test-integration 2>&1 | tee /tmp/synthetic-integration.log
          status=${PIPESTATUS[0]}
          set -e
          if ((status != 0)); then
            {
              echo "### Synthetic integration failure (${{ matrix.os }})"
              echo '```text'
              tail -n 120 /tmp/synthetic-integration.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Upload synthetic integration log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-integration-${{ matrix.os }}
          path: /tmp/synthetic-integration.log
          if-no-files-found: ignore

  real-integration:
    name: Real QEMU/libvirt fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install QEMU and libvirt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dnsmasq-base \
            libvirt-clients \
            libvirt-daemon-driver-qemu \
            libvirt-daemon-system \
            qemu-system-x86 \
            qemu-utils
      - name: Start isolated CI libvirt daemon
        run: |
          sudo systemctl stop \
            libvirtd.service libvirtd.socket \
            virtqemud.service virtqemud.socket || true
          sudo libvirtd -d -l -f "$GITHUB_WORKSPACE/ci/libvirtd.conf"
          for attempt in $(seq 1 30); do
            echo "libvirt readiness attempt $attempt"
            if virsh -c qemu+tcp://127.0.0.1/system list --all; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run mutating real fixtures
        env:
          LIBVIRT_REAL_INTEGRATION: "1"
          LIBVIRT_REAL_ALLOW_MUTATION: "1"
          LIBVIRT_REAL_START_GUEST: "1"
          LIBVIRT_REAL_URI: qemu+tcp://127.0.0.1/system
        run: make test-real
      - name: Collect libvirt diagnostics
        if: always()
        run: |
          virsh -c qemu+tcp://127.0.0.1/system list --all || true
          sudo chmod a+r /tmp/libvirtd-ci.log || true
      - name: Upload libvirt log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libvirtd-log
          path: /tmp/libvirtd-ci.log
          if-no-files-found: ignore

  vulnerability-scan:
    name: Govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          repo-checkout: false
          go-version-input: ""
          go-version-file: go.mod
          check-latest: false
          go-package: ./...
